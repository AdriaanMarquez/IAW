<VirtualHost *:80>
    #FASE3: Si quiero dejar la pagina incomunicada comento el SERVERNAME y reiniciamos el servidor docker exec -it apache-adrian service apache2 reload
    #ServerAlias localhost || Si quiero que me aparezca la pagina publica en el navegador poniendo el https:\\localhost:80
    ServerName docs.adrian.iaw
    DocumentRoot /var/www/docs.adrian

    ErrorLog ${APACHE_LOG_DIR}/docs_error.log
    CustomLog ${APACHE_LOG_DIR}/docs_access.log combined

    <Directory /var/www/docs.adrian>
        Require all granted
    </Directory>
</VirtualHost>
